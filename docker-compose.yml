services:
  postgres:
    image: postgres:16-alpine
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: boson
      POSTGRES_PASSWORD: boson
      POSTGRES_DB: boson
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U boson -d boson"]
      interval: 2s
      timeout: 5s
      retries: 10
    networks:
      - boson-network

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '3000:3000'
    environment:
      PORT: 3000
      ENV: development
      DBHOST: postgres
      DBPORT: 5432
      DBNAME: boson
      DBUSERNAME: boson
      DBPASSWORD: boson
      DBSSLMODE: disable
      # The dev auth service (profile dev-auth): keys fetched over the
      # compose network, issuer = its PUBLIC_URL.
      AUTH_JWKS_URL: http://auth:8080/.well-known/jwks.json
      AUTH_ISSUER: http://localhost:8080
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - boson-network

  # Local IRC server (Ergo) for trying the nick-claim flow end to end: its
  # REGISTER mail goes to mailpit, which the backend's POP3 worker drains.
  # Plain TCP on 6667; do not expose externally. `make ergo-up`.
  ergo:
    image: ghcr.io/ergochat/ergo:stable
    ports:
      - '6667:6667'
    volumes:
      - ./infra/ergo/ircd.yaml:/ircd/ircd.yaml:ro
      - ergo_data:/ircd
    # ergo's registration mailto callback delivers to mailpit. Soft
    # dependency: ergo can start without mailpit (it just won't be
    # able to deliver confirmation codes until mailpit is up), so
    # we don't gate on a healthcheck — just start mailpit first.
    depends_on:
      - mailpit
    networks:
      - boson-network
    profiles:
      - testing

  # ---- Mailpit (local-dev mailbox for the nickclaim flow) -------------
  #
  # Mailpit accepts SMTP on 1025, serves POP3 on 1110, and a web UI
  # on 8025. The backend's nickclaim POP3 worker talks the same
  # protocol here as it does to PurelyMail in production — same code
  # path, only the env vars differ. (POP3 not IMAP because mailpit
  # doesn't speak IMAP; PurelyMail supports both.)
  #
  # Activated via:  docker compose --profile dev-mail up -d
  # The ergo service above already delivers its NickServ mail here.
  mailpit:
    image: axllent/mailpit:latest
    profiles:
      - dev-mail
      - testing
    ports:
      - '1025:1025'  # SMTP — services packages deliver here
      - '1110:1110'  # POP3 — backend worker reads from here
      - '8025:8025'  # HTTP UI — open http://localhost:8025 to inspect
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: '1'
      MP_SMTP_AUTH_ALLOW_INSECURE: '1'
      # Enable POP3 + accept any-username/any-password. Mailpit's
      # POP3 server only starts when MP_POP3_AUTH is set; the value
      # is a space-separated list of user:pass pairs. `dev:dev`
      # matches the .env.example defaults so the backend worker
      # connects out of the box.
      MP_POP3_AUTH: 'dev:dev'
    networks:
      - boson-network

  # ---- MinIO (local S3 for the profile-image / avatar feature) --------
  #
  # R2 is S3-compatible, so local dev points the backend's CLOUDFLARE_R2_*
  # config at MinIO instead of real R2 (see config/config.dev.json).
  # The backend runs natively (`make run`) so it reaches MinIO at
  # localhost:9000; the desktop client loads avatars from the same origin
  # (CDN base = http://localhost:9000/boson), which is why the bucket is
  # made anonymously readable below.
  #
  # Activated via:  make minio-up  (folded into `make dev-up`)
  #
  # MinIO no longer publishes images to Docker Hub or quay.io, so we use
  # Chainguard's builds. The server image runs as uid 65532; `user: root`
  # keeps it able to write the named volume (dev only).
  minio:
    image: cgr.dev/chainguard/minio:latest
    user: root
    profiles:
      - dev-storage
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9000:9000'  # S3 API — backend PUTs, client GETs avatars
      - '9001:9001'  # web console — http://localhost:9001 (minioadmin/minioadmin)
    volumes:
      - minio_data:/data
    networks:
      - boson-network

  # One-shot: create the `boson` bucket + make it anonymously readable so
  # avatar URLs load directly in the client. Exits 0 once done.
  #
  # Chainguard's minio-client image has no shell, so copy its `mc` onto
  # wolfi-base (glibc + sh) to keep the wait-loop script below working.
  minio-setup:
    build:
      dockerfile_inline: |
        FROM cgr.dev/chainguard/minio-client:latest AS mc
        FROM cgr.dev/chainguard/wolfi-base:latest
        COPY --from=mc /usr/bin/mc /usr/bin/mc
    profiles:
      - dev-storage
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minioadmin minioadmin; do echo 'waiting for minio'; sleep 1; done;
      mc mb --ignore-existing local/boson;
      mc anonymous set download local/boson;
      echo 'minio bucket ready';
      "
    networks:
      - boson-network

  # ---- boson auth service (accounts, sign-in, tokens) -------------------
  #
  # github.com/boson-chat/auth, built from a checkout next to this repo
  # (AUTH_SRC=../auth by default). `make auth-up`. Public API on :8080 —
  # what the backend (AUTH_JWKS_URL / AUTH_ISSUER) and the client's .env
  # (VITE_AUTH_URL) point at. Its mail (verification, password reset)
  # goes to its own Mailpit, UI http://localhost:8026: the shared mailpit
  # above is drained by the backend's nick-claim worker.
  #
  # AUTH_KEY_ENCRYPTION_KEY below is a dev-only throwaway; production
  # generates its own (`auth keys gen-kek`) and keeps it secret.
  auth-postgres:
    image: postgres:18-alpine
    profiles:
      - dev-auth
    environment:
      POSTGRES_USER: auth
      POSTGRES_PASSWORD: auth
      POSTGRES_DB: auth
    volumes:
      - auth_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth -d auth"]
      interval: 2s
      timeout: 5s
      retries: 30
    networks:
      - boson-network

  auth-mailpit:
    image: axllent/mailpit:latest
    profiles:
      - dev-auth
    ports:
      - '8026:8025'
    networks:
      - boson-network

  auth:
    build:
      context: ${AUTH_SRC:-../auth}
    profiles:
      - dev-auth
    ports:
      - '8080:8080'
    environment:
      ENV: development
      PUBLIC_URL: http://localhost:8080
      COOKIE_SECURE: 'false'
      DATABASE_URL: postgres://auth:auth@auth-postgres:5432/auth?sslmode=disable
      AUTH_KEY_ENCRYPTION_KEY: ZGV2LW9ubHkta2V5LWJvc29uLWF1dGgtbG9jYWwtZHY=
      # The renderer in a browser (the client's Vite dev server) calls it directly;
      # the desktop app goes through its API proxy (no CORS).
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      REQUIRE_EMAIL_VERIFICATION: 'true'
      SMTP_HOST: auth-mailpit
      SMTP_PORT: '1025'
      SMTP_TLS: none
      SMTP_FROM: Boson <no-reply@localhost>
    depends_on:
      auth-postgres:
        condition: service_healthy
    networks:
      - boson-network

networks:
  boson-network:

volumes:
  postgres_data:
  auth_postgres_data:
  ergo_data:
  minio_data:
